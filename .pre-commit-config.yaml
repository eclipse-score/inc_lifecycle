repos:
  - repo: local
    hooks:
      - id: format-fix
        name: //:format.fix
        entry: bazel run //:format.fix
        language: system
        files: (BUILD|BUILD\.bazel|WORKSPACE|\.bazelrc|[^/]+\.(py|bzl|bazel|yaml|yml|rs|c|cpp|h|hpp))$
        pass_filenames: false
      - id: test-doubles-naming-fix
        name: Check and fix test double file names
        entry: ./scripts/fix_test_doubles_naming_precommit.py
        language: python
        files: '\.(cc|cpp|h|hpp)$'
        pass_filenames: true
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        name: clang-tidy
        # Run through a wrapper that sanitizes unsupported linker flags in
        # compile_commands.json before invoking clang-tidy.
        entry: python3 ./scripts/run_clang_tidy_precommit.py
        language: system
        files: '\.(c|cc|cpp|h|hpp)$'
        # all relevant files are currently excluded the checks are
        # not clarified yet, so we don't want to run clang-tidy on any files
        exclude: |
          (?x)^(
            externals/|
            examples/|
            tests/|
            score/
          )
  - repo: https://github.com/eclipse-score/tools
    rev: 7694bf823421b5542cd2f45239b8bdf205dbface
    hooks:
      - id: copyright
        exclude: ^.github/
