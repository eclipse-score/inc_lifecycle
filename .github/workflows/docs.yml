name: Documentation

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and test ${{ matrix.bazel-config }}
    uses: eclipse-score/cicd-workflows/.github/workflows/tests.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      bazel-target: "//score/... //examples/... --config=x86_64-linux"
      upload-name: testlogs

  docs-build:
    needs: build
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: read
    with:
      tests-report-artifact: testlogs
